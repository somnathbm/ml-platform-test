apiVersion: batch/v1
kind: Job
metadata:
  name: indexed-workers
spec:
  completions: 6
  parallelism: 2
  completionMode: Indexed

  template:
    metadata:
      labels:
        app: indexed-workers
        
    spec:
      restartPolicy: Never

      containers:
      - name: worker
        image: python:3.12-slim
        command:
        - python
        - -c
        - |
          import os
          import time

          index = os.environ.get("JOB_COMPLETION_INDEX")
          print(f"Worker index = {index}")
          print(f"Processing dataset shard {index}...")
          time.sleep(20)
          print(f"Shard index {index} completed.")