apiVersion: batch/v1
kind: Job
metadata:
  name: transient-failure-job
  labels:
    job: ml-job-transfail
spec:
  completions: 1
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: main
        image: python:3.12-slim
        volumeMounts:
        - name: attempt-state
          mountPath: /var/run/job-state
        command:
        - python
        - -c
        - |
          import os
          import sys

          def simulate_transfail():
            marker = "/var/run/job-state/failed-once"
            if not os.path.exists(marker):
              with open(marker, "w") as state:
                state.write("failed")
              print("First attempt: simulating transient failure...")
              sys.exit(1)

            print("Retry: transient failure resolved.")
            sys.exit(0)

          simulate_transfail()
      volumes:
      - name: attempt-state
        emptyDir: {}